name: Feature request
description: Suggest an improvement to released repository content.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Request features for released repository content only. Do not include confidential information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
